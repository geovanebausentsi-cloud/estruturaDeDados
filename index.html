<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de uma fila</title>
</head>

<body>
    <h2>filas</h2>
    <input type="text" id="pessoa">
    <button onclick="inserir(vetor)">Inserir</button>
    <button onclick="remover(vetor)">Remover</button>
    <!--button onclick="visualizar(vetor)">Visualizar</button-->

    <ol id="conteiner">

    </ol>
    
    <script>
        var vetor = ["maria", "Pedro", "joão", "Rudio"];
        visualizar(vetor);

        function inserir(vetor){
            var item = document.getElementById("pessoa").value;
            vetor.push(item);
            visualizar(vetor);
        }

        //FIFO -First In Firt Out
        function remover(vetor){
             vetor.shift();
             visualizar(vetor);
        }
        
        function visualizar(vetor){
            var lista = document.createElement('ol');
            var conteiner = document.getElementById('conteiner');
            conteiner.innerHTML = '';

            for (var i = 0; i < vetor.length; i++){
                var item = document.createElement('li');
                item.innerText = vetor[i];
                lista.appendChild(item);
            }
            conteiner.appendChild(lista)
        }
        

       let queue = []

        function enqueue(e) {
            queue.push(e);
        }

        function denqueue() {
            return queue.shift();
        }

        function size() {
            return queue.length;
        }

        function isEmpty() {
            return queue.length === 0;
        }

        function front() {
            if (queue.length === 0) {
                return null;
            }
            return queue[0];
        }

        enqueue(1);
        enqueue(2);
        enqueue(3);

        console.log(queue);  //[1, 2, 3]

        console.log(denqueue());//remove primeiro elemento
        console.log(queue); //[2, 3]

        console.log(size());//2
        console.log(isEmpty());//false

       /*Em resumo, a fila é uma estrutura de dados linear que segue o princípio FIFO, onde o primeiro
        elemento a entrar é o primeiro a sair. É possível implementar uma fila em JavaScript utilizando
        arrays e dois métodos nativos: push e shift. Essa estrutura é muito útil em diversas aplicações,
        como gerenciamento de tarefas em sistemas operacionais, processamento de eventos em
        tempo real e muito mais. É importante ressaltar que as operações de inserção e remoção na
        fila possuem complexidade O(1), o que significa que elas são muito eficientes.*/   
    </script>
</body>

</html>
