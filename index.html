<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumo de api - uso de funções assincronas</title>
</head>

<body>
    <h2>Todos os drinks</h2>
    <div id="resultado"></div>

    <script>
        let dadosLocais = [];

        async function buscarTodosDrinks() {
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = "<p>Carregando drinks...</p>";

            const letras = 'abcdefghijklmnopqrstuvwxyz'.split('');
            let todosDrinks = [];

            for (const letra of letras) {
                try {
                    const resposta = await fetch(`https://www.thecocktaildb.com/api/json/v1/1/search.php?f=${letra}`);
                    const dadosDaApi = await resposta.json();
                    if (Array.isArray(dadosDaApi.drinks)) {
                        todosDrinks = todosDrinks.concat(dadosDaApi.drinks);
                    }
                } catch (e) {
                    // Ignora erros de rede para cada letra
                }
            }

            dadosLocais = todosDrinks.map(drink => {
                let ingredientes = [];
                for (let i = 1; i <= 15; i++) {
                    const ingrediente = drink[`strIngredient${i}`];
                    const medida = drink[`strMeasure${i}`];
                    if (ingrediente) {
                        ingredientes.push({
                            nome: ingrediente,
                            medida: medida || ''
                        });
                    }
                }
                return {
                    nome: drink.strDrink,
                    categoria: drink.strCategory,
                    copo: drink.strGlass,
                    instrucoes: drink.strInstructions,
                    imagem: drink.strDrinkThumb,
                    ingredientes: ingredientes
                };
            });
            exibirDrinks();
        }

        function exibirDrinks() {
            let resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = "";
            dadosLocais.forEach(drink => {
                let ingredientesHtml = '<ul>';
                drink.ingredientes.forEach(ing => {
                    ingredientesHtml += `<li>${ing.nome}${ing.medida ? ' - ' + ing.medida : ''}</li>`;
                });
                ingredientesHtml += '</ul>';

                resultadoDiv.innerHTML += `
                    <div style="border:1px solid #ccc; margin:10px; padding:10px;">
                        <h3>${drink.nome}</h3>
                        <img src="${drink.imagem}" alt="${drink.nome}" width="150">
                        <p><strong>Categoria:</strong> ${drink.categoria}</p>
                        <p><strong>Tipo de copo:</strong> ${drink.copo}</p>
                        <p><strong>Instruções:</strong> ${drink.instrucoes}</p>
                        <strong>Ingredientes:</strong> ${ingredientesHtml}
                    </div>
                `;
            });
        }

        buscarTodosDrinks();
    </script>
</body>

</html>
